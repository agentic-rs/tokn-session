[workspace]
members = [
  "crates/core",
  "crates/pi",
  "crates/client",
  "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokn-agent-client = { path = "crates/client" }
tokn-agent-core = { path = "crates/core" }
tokn-agent-pi = { path = "crates/pi" }

