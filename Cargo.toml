[workspace]
members = [
  "crates/core",
  "crates/codex-protocol",
  "crates/codex",
  "crates/pi-protocol",
  "crates/pi",
  "crates/opencode-protocol",
  "crates/opencode",
  "crates/client",
  "crates/render",
  "crates/cli",
  "crates/relay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/agentic-rs/tokn-session"

[workspace.dependencies]
crossterm = "0.28"
notify = { version = "8.2.0", features = ["macos_kqueue"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokn-codex-protocol = { path = "crates/codex-protocol" }
tokn-opencode-protocol = { path = "crates/opencode-protocol" }
tokn-pi-protocol = { path = "crates/pi-protocol" }
tokn-session-client = { path = "crates/client" }
tokn-session-codex = { path = "crates/codex" }
tokn-session-core = { path = "crates/core" }
tokn-session-opencode = { path = "crates/opencode" }
tokn-session-pi = { path = "crates/pi" }
tokn-session-relay = { path = "crates/relay" }
tokn-session-render = { path = "crates/render" }
zeromq = "0.6.0"
