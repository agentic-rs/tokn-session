[package]
name = "tokn-session-viewer"
version.workspace = true
description = "Read-only desktop viewer for agent sessions"
edition.workspace = true
publish = false

[lib]
name = "tokn_session_viewer"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tokn-session-relay.workspace = true
tokn-session-client.workspace = true
tokn-session-core.workspace = true
tokn-session-index.workspace = true
tokn-session-render.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The workspace watcher intentionally keeps Notify 8/Kqueue for the relay.
# The viewer needs FSEvents instead: recursive Kqueue watches hold one vnode
# descriptor for every historical rollout file. A separate major-version
# package isolates that backend choice without changing the relay.
notify_fsevent = { package = "notify", version = "7.0.0" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify.workspace = true

[dev-dependencies]
tempfile = "3"
