[package]
name = "tokn-session-viewer"
version.workspace = true
description = "Read-only desktop viewer for agent sessions"
edition.workspace = true
publish = false

[lib]
name = "tokn_session_viewer"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
tokn-session-client.workspace = true
tokn-session-core.workspace = true
tokn-session-index.workspace = true
tokn-session-render.workspace = true

[dev-dependencies]
tempfile = "3"
